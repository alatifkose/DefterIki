# DEFTERIKI Alembic ayarı. Veritabanı URL'si burada YOKTUR: yol merkezi
# ayarlardan (defteriki.ayarlar) ya da uygulamanın verdiği bağlantıdan gelir
# (migrations/env.py). Komut satırı kullanımı:
#   uv run alembic upgrade head      (DEFTERIKI_* ortam değişkenleriyle)
# Uygulama içi kullanım: defteriki.sema.semayi_yukselt(veritabani)

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,alembic

[handlers]
keys =

[formatters]
keys =

[logger_root]
level = WARNING
handlers =

[logger_alembic]
level = WARNING
handlers =
qualname = alembic
