[project]
name = "defteriki"
version = "0.0.1"
description = "DEFTERIKI"
readme = "README.md"
authors = [
    { name = "Abdüllatif Köse", email = "alatif.dev@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.2",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.0.52",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.167.1",
    "pre-commit>=4.6.2",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
